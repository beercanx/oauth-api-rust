[package]
name = "oauth-api-rust"
version = "0.1.0"
edition = "2024"

[features]
default = ["diesel"]
sqlx = ["dep:sqlx"]
diesel = ["dep:diesel", "dep:diesel-async", "dep:diesel_migrations", "dep:libsqlite3-sys"]

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.5", features = ["typed-header"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "signal"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
form_urlencoded = "1.2.2"
tower = "0.5.3"
diesel = { version = "2.3.9", optional = true, features = ["returning_clauses_for_sqlite_3_35", "chrono"] }
diesel-async = { version = "0.9.0", optional = true, features = ["sqlite", "deadpool", "migrations"] }
diesel_migrations = { version = "2.3.2", optional = true }
libsqlite3-sys = { version = "*", optional = true, features = ["bundled"] }
chrono = { version = "0.4.44", features = ["serde"] }
sqlx = { version = "0.8.6", optional = true, features = [ "runtime-tokio", "sqlite", "uuid", "chrono", "derive", "macros" ] }
anyhow = "1.0.102"
thiserror = "2.0.18"
trait-variant = "0.1.2"

[dev-dependencies]
assertables = "9.9.0"
base64 = "0.22.1"
http-body-util = "0.1.3"
serde_json = "1.0.149"
