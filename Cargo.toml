[package]
name = "oauth-api-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[features]
default = []

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
form_urlencoded = "1.2.2"
tower = "0.5.3"
diesel = { version = "2.3.9", features = ["returning_clauses_for_sqlite_3_35", "chrono", "serde_json"] }
diesel-async = { version = "0.9.0", features = ["sqlite", "deadpool", "migrations"] }
diesel_migrations = { version = "2.3.2" }
libsqlite3-sys = { version = "*", features = ["bundled"] }
chrono = { version = "0.4.44", features = ["serde"] }
anyhow = "1.0.102"
thiserror = "2.0.18"
trait-variant = "0.1.2"
strum = "0.28.0"
strum_macros = "0.28.0"

[dev-dependencies]
assertables = "10.1.0"
base64 = "0.23.0"
http-body-util = "0.1.3"
